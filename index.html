<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>WEEK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================= *
 * WEEK — style bible (locked). Palette role-named, no others.   *
 * ============================================================= */
:root{
  --panel:#E7E8E5;
  --panel-deep:#DBDDD9;
  --surface:#F7F7F5;
  --ink:#1C1D1B;
  --ink-2:#73766F;
  --line:#B7BAB3;
  --signal:#FF4A00;

  --display:"Archivo", system-ui, "Helvetica Neue", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body:system-ui, "Helvetica Neue", Arial, sans-serif;

  /* one gutter for the whole app: header, screens and rows share this edge */
  --gutter:20px;
  --r4:4px; --r6:6px;
  --hatch:repeating-linear-gradient(45deg,
      var(--line) 0, var(--line) 1px, var(--surface) 1px, var(--surface) 5px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--panel);
  /* 1px dot grid, 24px pitch, ~35% opacity, panel only */
  background-image:radial-gradient(var(--line) 0.75px, transparent 0.75px);
  background-size:24px 24px;
  background-position:0 0;
  color:var(--ink);
  font-family:var(--body);
  font-size:15px; line-height:22px;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0;}
button:focus-visible, [tabindex]:focus-visible, a:focus-visible{
  outline:2px solid var(--ink); outline-offset:2px;
}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
.caps{font-family:var(--mono); text-transform:uppercase; letter-spacing:0.08em; font-size:11px; line-height:14px;}
.dim{color:var(--ink-2);}

/* ---- app frame ---- */
#app{
  max-width:520px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
.banner{
  background:var(--ink); color:var(--surface);
  font-family:var(--mono); font-size:12px; letter-spacing:0.04em;
  padding:8px 16px; text-align:center;
}
.banner.signal{background:var(--signal);}

/* ---- header ---- */
header{
  padding:36px var(--gutter) 18px; display:flex; align-items:flex-start;
  justify-content:space-between; gap:12px;
}
header .lede h1{
  font-family:var(--display); font-weight:600; font-size:32px; line-height:34px;
  letter-spacing:-0.01em; margin:0;
}
header .lede .wk{ margin-top:6px; color:var(--ink-2); }
.gear{
  width:44px; height:44px; border:1.5px solid var(--line); border-radius:var(--r4);
  background:var(--surface); display:grid; place-items:center; flex:none;
}
.gear:active{border:2px solid var(--ink);}

/* ---- screen container ---- */
main{flex:1; padding:0 var(--gutter);}
.screen{display:none;}
.screen.on{display:block; animation:fade 120ms ease both;}
@keyframes fade{from{opacity:0;} to{opacity:1;}}

/* ---- section heads ---- */
.sec-head{
  font-family:var(--display); font-weight:600; font-size:17px;
  margin:34px 0 14px;
}
.tiny-head{margin:28px 0 12px; color:var(--ink-2);}

/* ---- tip slot ---- */
.tip{
  background:var(--surface); border:1.5px solid var(--line);
  border-left:3px solid var(--signal);
  border-radius:var(--r4); padding:13px 15px; margin:4px 0 6px;
  display:flex; gap:12px; align-items:flex-start;
}
.tip .body{flex:1;}
.tip .lbl{color:var(--signal);}
.tip .txt{font-size:14px; line-height:20px; margin-top:3px;}
.tip .x{width:32px; height:32px; margin:-6px -6px 0 0; flex:none; display:grid; place-items:center; color:var(--ink-2);}

/* ---- goal row (full-width table row) ---- */
.rows{border-top:1px solid var(--line);}
.grow{
  border-bottom:1px solid var(--line);
  padding:17px 0; position:relative;
}
.grow.risk{border-left:3px solid var(--signal); padding-left:14px; margin-left:-14px;}
.grow .top{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
.grow .name{font-family:var(--display); font-weight:600; font-size:15px;}
.grow .meta{color:var(--ink-2); margin-top:2px;}
.grow .meta .over{color:var(--signal);}
.grow .ctl{margin-top:12px;}
.grow .nudge{color:var(--ink-2); font-size:13px; margin-top:8px;}
.grow.risk .nudge{color:var(--ink);}
.recessed{background:var(--panel-deep); border-radius:var(--r4); padding:2px 14px; margin:0 0 4px;}
.recessed .grow:last-child{border-bottom:none;}

/* ---- 7-cell week strip ---- */
.strip{display:flex; gap:3px; flex-wrap:nowrap; width:100%;}
.cell{
  flex:1 1 0; min-width:38px; height:48px;
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r4);
  position:relative; display:grid; place-items:center;
  padding:0; transition:transform 120ms cubic-bezier(0.2,0,0,1);
}
.cell .d{position:absolute; top:3px; left:0; right:0; text-align:center;
  font-family:var(--mono); font-size:10px; color:var(--ink-2);}
.cell.today{border:2px solid var(--ink);}
.cell.hit{background:var(--ink);}
.cell.hit .d{color:var(--panel);}
.cell.hit .glyph{color:var(--surface);}
.cell.miss{background:var(--hatch);}
.cell.resolved{background:var(--hatch);}
.cell.resolved::after{content:""; width:6px; height:6px; border-radius:50%; background:var(--ink); position:absolute;}
.cell.moved{color:var(--ink-2);}
.cell.moved .glyph{font-family:var(--mono); font-size:18px; color:var(--ink-2);}
.cell.dest{border-style:dashed;}
.cell.future{background:var(--surface);}
.cell.nip{background:transparent; border-color:var(--line); opacity:0.3;}
.cell.blank{background:transparent; opacity:0.32;}
.cell.blank.tap{opacity:0.65;}
.cell .glyph.plus{font-family:var(--mono); font-size:17px; color:var(--ink-2); line-height:1;}
.cell.tap{cursor:pointer;}
.cell.tap:active{transform:scale(0.94);}

/* Hit-area expansion. The bible locks visual faces (day cell 38x46, pool box 24,
   chip h34); criterion 12 requires >=44px touch targets. Each control keeps its
   drawn face and grows an invisible hit area instead. Expansions are sized to
   stay inside the neighbouring gap, so targets never overlap. */
.cell.tap::before, .tip .x::before, .pbox::before,
.daychip::before, .chip::before, .btn.sm::before, .step-btn::before{
  content:""; position:absolute; left:0; top:0; right:0; bottom:0;
}
.cell.tap::before{inset:-4px -3px;}      /* 38x46 -> 44x54, only today's cell */
.tip .x::before{inset:-6px;}             /* 32     -> 44 */
.pbox::before{inset:-10px;}              /* 24     -> 44 */
.daychip::before{inset:-8px -4px;}       /* h28    -> h44 */
.chip::before{inset:-5px 0;}             /* h34    -> h44 */
.btn.sm::before{inset:-3px 0;}           /* h38    -> h44 */
.step-btn::before{inset:-2px;}           /* 40     -> 44 (compact variants) */
.tip .x, .pbox, .daychip, .chip, .btn.sm, .step-btn{position:relative;}
.cell .glyph{font-size:16px; line-height:1;}
.cell.anim{animation:tick 120ms cubic-bezier(0.2,0,0,1);}
@keyframes tick{from{transform:scale(0.94);} to{transform:scale(1);}}

/* ---- counter stepper ---- */
.stepper{display:flex; gap:3px; align-items:stretch; width:100%;}
.step-btn{
  width:64px; height:48px; flex:none; background:var(--surface);
  border:1.5px solid var(--line); border-radius:var(--r4);
  font-family:var(--mono); font-size:22px; display:grid; place-items:center;
}
.step-btn:active{background:var(--ink); color:var(--surface); border-color:var(--ink);}
.step-val{
  flex:1 1 0; height:48px; padding:0 10px; background:var(--surface);
  border:1.5px solid var(--line); border-radius:var(--r4);
  font-family:var(--mono); font-size:22px; display:grid; place-items:center;
}
.step-meta{margin-left:12px; align-self:center; color:var(--ink-2);}
.stepper.compact{width:auto; flex:none;}
.stepper.compact .step-btn{width:44px; height:44px; font-size:18px;}
.step-val.hour{flex:none; width:78px; height:44px; font-size:16px;}

/* ---- pool items ---- */
.pool{display:flex; flex-direction:column; gap:2px;}
/* row pitch >= 48 so the box and day-chip hit areas stay inside their own row */
.pitem{display:flex; align-items:center; gap:14px; padding:8px 0; min-height:44px;}
.pbox{
  width:24px; height:24px; flex:none; border:1.5px solid var(--line);
  border-radius:3px; background:var(--surface); display:grid; place-items:center;
}
.pbox.on{background:var(--ink); border-color:var(--ink);}
.pbox .glyph{color:var(--surface); font-size:14px;}
.pitem .pname{flex:1; font-family:var(--display); font-weight:500; font-size:15px;}
.pitem.done .pname{color:var(--ink-2);}
.daychip{
  font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em;
  font-size:10px; width:52px; min-height:28px; display:inline-flex;
  align-items:center; justify-content:center; border:1.5px solid var(--line);
  border-radius:3px; background:var(--surface); color:var(--ink-2); flex:none;
}
.daychip.done{opacity:0.5;}

/* ---- chips ---- */
/* gap >= the chips' vertical hit expansion so wrapped rows never overlap */
.chips{display:flex; flex-wrap:wrap; gap:12px;}
.chip{
  font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em;
  font-size:11px; height:34px; padding:0 12px; display:inline-flex; align-items:center;
  border:1.5px solid var(--line); border-radius:var(--r4); background:var(--surface);
}
.chip.sel{background:var(--ink); color:var(--surface); border-color:var(--ink);}
.chip.suggest{border:2px solid var(--signal);}
.chip .sub{margin-left:6px; opacity:0.7; font-size:9px;}

/* ---- buttons ---- */
.btn{
  height:48px; padding:0 18px; border-radius:var(--r4);
  font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em; font-size:12px;
  border:1.5px solid var(--ink); background:var(--surface); display:inline-flex;
  align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn.primary{background:var(--ink); color:var(--surface);}
.btn.commit{background:var(--signal); color:var(--surface); border-color:var(--signal);}
.btn.quiet{border-color:var(--line); background:var(--surface); color:var(--ink-2);}
.btn.add{border-color:var(--line); border-style:dashed; background:transparent; color:var(--ink-2);}
.btn:disabled{opacity:0.4;}
.btn.sm{height:38px; width:auto; padding:0 14px;}
.btnrow{display:flex; gap:8px; margin-top:10px;}

/* ---- verdict token ---- */
.vtok{
  width:26px; height:26px; flex:none; border:1.5px solid var(--line); border-radius:var(--r4);
  display:grid; place-items:center;
}
.vtok.hit{background:var(--ink); border-color:var(--ink);}
.vtok.hit .glyph{color:var(--surface); font-size:15px;}
.vtok.miss{background:var(--hatch);}
.vtok.pending{background:var(--surface);}
.vtok.pending::after{content:""; width:9px; height:1.5px; background:var(--ink-2);}

/* ---- week table ---- */
.wtable .grow{cursor:pointer;}
.wtable .stripwrap{margin-top:12px; overflow-x:auto;}
.detail{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
.field{display:flex; align-items:center; gap:10px; margin:8px 0;}
.field label{width:96px; color:var(--ink-2);}
.num{
  width:64px; height:40px; border:1.5px solid var(--line); border-radius:var(--r4);
  background:var(--surface); font-family:var(--mono); font-size:16px; text-align:center;
}
.txtin{
  height:44px; border:1.5px solid var(--line); border-radius:var(--r4);
  background:var(--surface); font-family:var(--body); font-size:15px; padding:0 12px; width:100%;
}
.daypick{display:flex; gap:4px; flex-wrap:wrap;}
.dtog{
  width:40px; height:40px; border:1.5px solid var(--line); border-radius:var(--r4);
  background:var(--surface); font-family:var(--mono); font-size:11px;
  text-transform:uppercase; display:grid; place-items:center;
}
.dtog.on{background:var(--ink); color:var(--surface); border-color:var(--ink);}

/* ---- trophies ---- */
.stamps{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:8px 0;}
.stamp{display:flex; flex-direction:column; align-items:center; gap:6px;}
.stamp .sq{
  width:100%; aspect-ratio:1; border:1.5px solid var(--line); border-radius:var(--r4);
  display:grid; place-items:center; background:var(--surface);
  font-family:var(--mono); font-weight:600; font-size:19px; letter-spacing:0.02em;
}
.stamp.locked .sq{background:var(--hatch); color:var(--ink-2);}
.stamp.on .sq{background:var(--ink); color:var(--surface); border-color:var(--ink);}
.stamp .cap{font-size:9px; color:var(--ink-2); text-align:center;}
.stamp.stamped .sq{animation:stampin 240ms cubic-bezier(0.2,0,0,1);}
@keyframes stampin{0%{transform:scale(1.15);} 40%{opacity:0.6;} 100%{transform:scale(1);}}
.arch{border-top:1px solid var(--line); margin-top:8px;}
.archrow{
  display:flex; align-items:center; gap:12px; padding:15px 0;
  border-bottom:1px solid var(--line); font-family:var(--mono); font-size:13px;
}
.archrow .wk{width:56px; color:var(--ink-2);}
.archrow .score{width:52px;}
.archrow .tag{margin-left:auto; text-transform:uppercase; letter-spacing:0.06em; font-size:11px; color:var(--ink-2);}
.archrow .tag.sweep{color:var(--ink);}

/* ---- bottom nav ---- */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:var(--surface); border-top:1.5px solid var(--line);
  display:flex; max-width:520px; margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; height:64px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:4px; color:var(--ink-2);
  font-family:var(--mono); text-transform:uppercase; letter-spacing:0.08em; font-size:10px;
}
nav button.on{color:var(--ink);}
nav button .ic{width:20px; height:20px;}
nav button.on .ic{color:var(--ink);}

/* ---- sheets / dialogs ---- */
.scrim{
  position:fixed; inset:0; z-index:40; background:rgba(28,29,27,0.35);
  display:none; align-items:flex-end; justify-content:center;
}
.scrim.on{display:flex; animation:fade 120ms ease both;}
.sheet{
  background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r6) var(--r6) 0 0;
  box-shadow:2px 2px 0 var(--line); width:100%; max-width:520px;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88dvh; overflow-y:auto;
}
.dialog{
  background:var(--surface); border:1.5px solid var(--ink); border-radius:var(--r6);
  box-shadow:2px 2px 0 var(--line); width:calc(100% - 40px); max-width:400px;
  padding:22px; margin:auto;
}
.scrim.center{align-items:center;}
.sheet, .dialog{position:relative;}
.panel-x{
  position:absolute; top:10px; right:10px; width:44px; height:44px;
  display:grid; place-items:center; color:var(--ink-2); font-size:22px; line-height:1;
}
.sheet h2, .dialog h2{padding-right:40px;}
.sheet h2, .dialog h2{font-family:var(--display); font-weight:600; font-size:19px; margin:0 0 4px;}
.sheet .row{display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:16px 0; border-bottom:1px solid var(--line);}
.rownote{font-size:12px; line-height:16px; color:var(--ink-2); margin-top:3px; max-width:20ch;}
.sheet .row:last-of-type{border-bottom:none;}
.dialog p{font-size:14px; line-height:20px; color:var(--ink-2); margin:6px 0 16px;}

/* ---- review takeover ---- */
#review-screen{padding:0;}
.rzone{margin-top:24px;}
.rgoal{display:flex; align-items:flex-start; gap:14px; padding:18px 0; border-bottom:1px solid var(--line);}
.rgoal .rname{font-family:var(--display); font-weight:600; font-size:15px;}
.rgoal .rdiag{color:var(--ink-2); font-size:13px; margin-top:3px;}
.rdecide{margin-top:10px;}
.empty{color:var(--ink-2); font-size:14px; padding:16px 0;}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-property:opacity !important;}
  .cell.tap:active{transform:none;}
}
</style>
</head>
<body>
<div id="app" hidden>
  <div id="banner-slot"></div>
  <header>
    <div class="lede">
      <h1 id="h-day">—</h1>
      <div class="wk caps" id="h-week">—</div>
    </div>
    <button class="gear" id="btn-gear" aria-label="Settings">
      <svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>
      </svg>
    </button>
  </header>

  <main>
    <section id="today-screen" class="screen"></section>
    <section id="week-screen" class="screen"></section>
    <section id="trophies-screen" class="screen"></section>
    <section id="review-screen" class="screen"></section>
  </main>

  <nav id="nav">
    <button data-tab="today" class="on">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="17" rx="1"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      Today
    </button>
    <button data-tab="week">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="2.6" height="12" rx="0.5"/><rect x="7.5" y="6" width="2.6" height="12" rx="0.5"/><rect x="12" y="6" width="2.6" height="12" rx="0.5"/><rect x="16.5" y="6" width="2.6" height="12" rx="0.5"/></svg>
      Week
    </button>
    <button data-tab="trophies">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4h12v3a6 6 0 0 1-12 0V4z"/><path d="M6 5H3v2a3 3 0 0 0 3 3M18 5h3v2a3 3 0 0 1-3 3M9 20h6M12 13v7"/></svg>
      Trophies
    </button>
  </nav>
</div>

<div id="scrim" class="scrim"></div>

<script>
"use strict";
/* =====================================================================
 * WEEK — v1 engine + UI. One file. No deps.
 * Day indexing everywhere: ISO Mon=0 … Sun=6.
 * ===================================================================== */

/* ------------------------------ CFG -------------------------------- */
const CFG = {
  storageKey: "week.v1",
  schemaVersion: 1,
  goalsSoft: 4,          // free slots
  frictionAt: 5,         // 5th goal → friction dialog
  goalsHard: 6,          // 6 = hard cap
  reviewUnlockDay: 6,    // Sunday (Mon=0..Sun=6)
  reviewUnlockHour: 18,  // 18:00
  defaultGraceHour: 14,  // yesterday stays editable until this hour (user-adjustable)
  graceHourMin: 1, graceHourMax: 23,
  defaultReviewHour: 20.5,
  tipCooldownDays: 21,
  poolMin: 2, poolMax: 8,
  counterMax: 12,
};

/* ------------------------------ STR -------------------------------- */
const STR = {
  storageUnavailable: "Storage unavailable — demo mode",
  today: "Today", week: "Week", trophies: "Trophies",
  yesterdayOpen: "Yesterday — open till ",
  reviewReady: "Review ready — Sunday reckoning",
  openReview: "Open review",
  noGoals: "No goals yet — plan the week.",
  addGoal: "+ Add goal",
  commitWeek: "Commit week",
  planWeek: "Plan the week",
  spare: "SPARE", spares: "SPARE", overBy: "OVER BY",
  keep:"Keep", adjust:"Adjust", park:"Park", drop:"Drop", raise:"Raise",
  parkOne:"Park one…", addAnyway:"Add anyway",
  fullWeek:"Full week. Five-goal weeks fail more often than four-goal weeks. Park one instead?",
  hardCap:"Six goals is the ceiling. Park or drop one to add another.",
};

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_INI = ["M","T","W","T","F","S","S"];
const DAY_FULL = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

/* ============================ PURE MATH ============================ *
 * All goal math: state in, verdict out. No DOM, no storage. Tested.  *
 * ================================================================== */

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* Late-commit proration. W = weekday committed (Mon=0). */
function daysInPlay(committedDay){ return 7 - committedDay; }
function prorate(T, dip){ return clamp(Math.round(T * dip / 7), 1, dip); }

/* ---- QUOTA ---- */
/* days: map {idx:"hit"|"miss"|"resolved"|"unlogged"}. dip = in-play day count. */
function quotaMath(target, days, dip){
  dip = dip == null ? 7 : dip;
  let hits=0, miss=0, resolved=0;
  for (const k in days){
    const s = days[k];
    if (s==="hit") hits++;
    else if (s==="miss") miss++;
    else if (s==="resolved") resolved++;
  }
  const sparesTotal = dip - target;
  const misses = miss + resolved;
  const sparesLeft = sparesTotal - misses;
  return {
    hits, misses, sparesTotal, sparesLeft,
    over: sparesLeft < 0 ? -sparesLeft : 0,
    verdict: hits >= target ? "HIT" : "MISS",
  };
}

/* ---- POOL ---- */
/* remaining = items not yet done. daysLeft = full days after today (Sun incl). */
function poolRisk(remaining, daysLeft){
  if (remaining <= 0) return "safe";
  if (remaining < daysLeft) return "safe";
  if (remaining === daysLeft) return "tight";
  return "risk";
}
function poolVerdict(remaining){ return remaining === 0 ? "HIT" : "MISS"; }

/* ---- COUNTER ---- */
/* counts: map {idx:number}. */
function counterMath(perDay, daysTarget, counts){
  let daysHit=0;
  for (const k in counts){ if (counts[k] >= perDay) daysHit++; }
  return { daysHit, daysTarget, verdict: daysHit >= daysTarget ? "HIT" : "MISS" };
}

/* ---- FIXED ---- */
/* scheduledDays: [idx]. days: {idx:state}. swaps: {origin:dest}. */
function fixedInstances(scheduledDays, days, swaps){
  swaps = swaps || {};
  return scheduledDays.map(function(d){
    if (swaps[d] != null){
      const to = swaps[d];
      return { origin:d, day:to, state: days[to] || "unlogged", moved:true };
    }
    return { origin:d, day:d, state: days[d] || "unlogged", moved:false };
  });
}
function fixedVerdict(scheduledDays, days, swaps){
  const inst = fixedInstances(scheduledDays, days, swaps);
  return inst.every(function(i){ return i.state === "hit"; }) ? "HIT" : "MISS";
}
/* Earliest instance still owed: not yet hit and not already moved. */
function outstandingFixedInstance(wg){
  const swaps = wg.swaps || {};
  const owed = wg.snap.days.filter(function(o){
    if (swaps[o] != null) return false;                  // already moved once
    return (wg.days[o] || "unlogged") !== "hit";
  });
  return owed.length ? owed[0] : null;
}
/* Log a session on a day the goal is not scheduled for. The session absorbs the
   earliest owed instance by moving it here, so the verdict math is unchanged and
   the one-swap-per-instance rule still holds. Tapping again releases it.
   Unlike trySwapFixed this records something that already happened, so it does
   not require a future day to remain. Returns "logged" | null. */
function logFixedOffDay(wg, d){
  const swaps = wg.swaps || (wg.swaps = {});
  if (fixedDestOrigin(wg, d) != null) return null;        // already holds a session
  const origin = outstandingFixedInstance(wg);
  if (origin == null) return null;                       // nothing owed to absorb
  swaps[origin] = d;
  wg.days[d] = "hit";
  delete wg.days[origin];
  return "logged";
}

/* Which instance, if any, currently sits on this day because it was moved here. */
function fixedDestOrigin(wg, d){
  const swaps = wg.swaps || {};
  for (const o in swaps){ if (swaps[o] === d) return +o; }
  return null;
}
/* Send a moved session back to its own day. */
function releaseFixedDay(wg, d){
  const o = fixedDestOrigin(wg, d);
  if (o == null) return false;
  delete wg.swaps[o]; delete wg.days[d];
  return true;
}

/* Attempt a single swap. Returns {ok, reason}. Mutates swaps on success. */
function trySwapFixed(swaps, scheduledDays, origin, dest, todayIdx){
  if (swaps[origin] != null) return { ok:false, reason:"already-swapped" };
  // ≥1 future day must remain (dest must be strictly after today, or any free future day)
  const occupied = new Set(scheduledDays.filter(d=>swaps[d]==null));
  for (const o in swaps) occupied.add(swaps[o]);
  if (occupied.has(dest)) return { ok:false, reason:"day-taken" };
  if (dest <= todayIdx) return { ok:false, reason:"needs-future" };
  swaps[origin] = dest;
  return { ok:true };
}

/* ---- generic per-goal verdict ---- */
function goalVerdict(type, snap, wg){
  if (type==="quota") return quotaMath(snap.target, wg.days, snap.dip||7).verdict;
  if (type==="pool")  return poolVerdict(poolRemaining(snap, wg));
  if (type==="counter") return counterMath(snap.perDay, snap.daysTarget, wg.counts).verdict;
  if (type==="fixed") return fixedVerdict(snap.days, wg.days, wg.swaps);
  return "MISS";
}
function poolRemaining(snap, wg){
  const done = wg.poolDone || {};
  let n=0;
  for (let i=0;i<snap.items.length;i++){ if (!done[i]) n++; }
  return n;
}

/* ---- resolver (grace sweep) ---- */
/* For a week, resolve unlogged past days. now = {day, hour}. Mutates wg.days. */
/* live grace deadline; falls back to the default for state saved before it existed */
function graceHour(){
  const v = state && state.settings ? state.settings.graceHour : null;
  return (typeof v === "number") ? v : CFG.defaultGraceHour;
}
/* gh is explicit so the resolver stays a pure function the harness can pin */
function isResolvable(dayIdx, now, gh){
  if (gh == null) gh = graceHour();
  if (dayIdx > now.day) return false;      // future
  if (dayIdx === now.day) return false;    // today, editable
  if (dayIdx === now.day - 1) return now.hour >= gh; // yesterday
  return true;                             // older than yesterday
}
function resolveWeek(goals, wk, now, gh){
  const startDay = wk.committedOnDay || 0;
  for (const wg of wk.goals){
    const g = goals.find(x=>x.id===wg.goalId); if (!g) continue;
    for (let d=startDay; d<7; d++){
      if (!isResolvable(d, now, gh)) continue;
      if (g.type==="quota" || g.type==="fixed"){
        if (g.type==="fixed" && !wg.snap.days.includes(d) && !invSwapHas(wg, d)) continue;
        if (g.type==="fixed" && invSwapOrigin(wg, d)) continue; // origin moved away
        if (!wg.days[d] || wg.days[d]==="unlogged") wg.days[d] = "resolved";
      }
      // counter: keep count (0 => not hit). pool: nothing to resolve.
    }
  }
}
function invSwapHas(wg, destDay){ // is destDay a swap destination?
  for (const o in (wg.swaps||{})) if (wg.swaps[o]===destDay) return true;
  return false;
}
function invSwapOrigin(wg, day){ return (wg.swaps||{})[day] != null; }

/* ---- slot friction ---- */
function slotAction(activeCount){
  if (activeCount >= CFG.goalsHard - 1) return "blocked"; // 5 present => 6th hard-blocked
  if (activeCount >= CFG.frictionAt - 1) return "friction"; // 4 present => 5th triggers friction
  return "ok";                                            // <4 => plain add
}

/* ============================ ISO WEEK ============================ */
function isoInfo(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dn = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate() - dn + 3);
  const firstThu = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const fdn = (firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate() - fdn + 3);
  const week = 1 + Math.round((d - firstThu)/(7*24*3600*1000));
  return { year:d.getUTCFullYear(), week };
}
function weekKeyOf(date){ const i=isoInfo(date); return i.year+"-W"+String(i.week).padStart(2,"0"); }
function mondayOf(date){
  const d = new Date(date); const dn=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dn); d.setHours(0,0,0,0); return d;
}
function weekLabel(date){
  const i = isoInfo(date);
  const mon = mondayOf(date);
  const sun = new Date(mon); sun.setDate(sun.getDate()+6);
  const a = mon.getDate()+" "+MON[mon.getMonth()];
  const b = String(sun.getDate()).padStart(2,"0")+" "+MON[sun.getMonth()];
  return "WEEK "+i.week+" · "+String(mon.getDate()).padStart(2,"0")+" "+MON[mon.getMonth()]+" – "+b;
}
function prevWeekKey(key){
  // key => date of that week's monday, minus 7 days
  const mon = mondayOfKey(key); mon.setDate(mon.getDate()-7); return weekKeyOf(mon);
}
function mondayOfKey(key){
  const m = key.match(/(\d+)-W(\d+)/); const year=+m[1], wk=+m[2];
  const jan4 = new Date(year,0,4);
  const mon = mondayOf(jan4);
  mon.setDate(mon.getDate() + (wk-1)*7);
  return mon;
}

/* ============================ CLOCK ============================ */
/* Real device-local time, with optional URL override for testing/demo. */
const QS = new URLSearchParams(location.search);
function now(){
  if (QS.has("now")){
    const d = new Date(QS.get("now"));
    if (!isNaN(d)) return d;
  }
  return new Date();
}
function nowCtx(){
  const d = now();
  return { date:d, day:(d.getDay()+6)%7, hour:d.getHours()+d.getMinutes()/60, key:weekKeyOf(d) };
}

/* ============================ STORAGE ============================ */
let STORE_OK = true;
function storageProbe(){
  try{
    const k="__wk_probe__"; localStorage.setItem(k,"1"); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function freshState(){
  return {
    schemaVersion: CFG.schemaVersion,
    settings: { reviewHour: CFG.defaultReviewHour, graceHour: CFG.defaultGraceHour, lang:"en" },
    goals: [],
    weeks: {},
    achievements: {},
    tips: {},
  };
}
let state = null;
function load(){
  STORE_OK = storageProbe();
  if (!STORE_OK){ state = seedState(); return; }
  const raw = localStorage.getItem(CFG.storageKey);
  if (!raw){ state = seedState(); save(); return; }
  try{
    const parsed = JSON.parse(raw);
    if (parsed.schemaVersion !== CFG.schemaVersion) throw new Error("schema");
    state = parsed;
  }catch(e){
    state = seedState(); save();
  }
}
function save(){
  if (!STORE_OK) return;
  try{ localStorage.setItem(CFG.storageKey, JSON.stringify(state)); }catch(e){ STORE_OK=false; renderBanner(); }
}

/* Seed = fresh state + the 4 seed goals staged for planning (uncommitted). */
function seedState(){
  const s = freshState();
  const wk = nowCtx().key;
  s.goals = [
    { id:"g1", type:"quota",  name:"No snacking", params:{ target:5 }, status:"active", createdWeek:wk },
    { id:"g2", type:"pool",   name:"Strength", params:{ items:[
        {name:"pull ups"},{name:"rows"},{name:"push ups"},{name:"pike push ups"}] }, status:"active", createdWeek:wk },
    { id:"g3", type:"counter",name:"Water", params:{ perDay:3, daysTarget:7 }, status:"active", createdWeek:wk },
    { id:"g4", type:"fixed",  name:"Treadmill 10 min", params:{ days:[0,2,4], label:"10 MIN" }, status:"active", createdWeek:wk },
  ];
  return s;
}

/* ============================ COMMIT / WEEK BUILD ============================ */
/* Build a week entry from active goals, prorated to commit day. */
function buildWeek(committedDay){
  const dip = daysInPlay(committedDay);
  const active = state.goals.filter(g=>g.status==="active");
  const wg = active.map(function(g){
    const snap = snapshotParams(g, committedDay, dip);
    return { goalId:g.id, snap, days:{}, swaps:{}, counts:{}, poolDone:{}, verdict:null };
  });
  return { committedOnDay:committedDay, goals:wg, reviewedAt:null, decisions:{} };
}
function snapshotParams(g, committedDay, dip){
  if (g.type==="quota"){
    return { target: prorate(g.params.target, dip), dip:dip, baseTarget:g.params.target };
  }
  if (g.type==="pool"){
    // auto-spread suggested days Mon–Sat, dropping days before commit
    const items = g.params.items.map(function(it, i){
      let sd = i % 6; // Mon..Sat
      if (sd < committedDay) sd = clamp(committedDay, 0, 5);
      return { name:it.name, suggestedDay:sd };
    });
    return { items, dip:dip };
  }
  if (g.type==="counter"){
    return { perDay:g.params.perDay, daysTarget:prorate(g.params.daysTarget, dip), dip:dip, baseDaysTarget:g.params.daysTarget };
  }
  if (g.type==="fixed"){
    // drop fixed instances before commit day
    const days = g.params.days.filter(d=>d>=committedDay);
    return { days, label:g.params.label||"", dip:dip };
  }
  return { dip:dip };
}

/* Determine app phase for current week. */
function currentWeekKey(){ return nowCtx().key; }
function phase(){
  const ck = currentWeekKey();
  // forced review: any prior committed but unreviewed week that is older than current
  const forced = findForcedReview(ck);
  if (forced){
    // still entitled to yesterday: let it be logged before judging the week
    const g = graceTarget();
    if (g && g.key===forced && weekHasUnlogged(forced, g.day))
      return { mode:"grace", key:forced, day:g.day };
    return { mode:"review", key:forced, forced:true };
  }
  if (!state.weeks[ck]) return { mode:"planning", key:ck };
  // review window on Sunday
  return { mode:"active", key:ck };
}
function findForcedReview(currentKey){
  // most recent prior committed-but-unreviewed week; older skipped ones archive as unreviewed
  const keys = Object.keys(state.weeks)
    .filter(k=>k < currentKey && state.weeks[k].reviewedAt==null && !state.weeks[k].abandoned);
  keys.sort();
  return keys.length ? keys[keys.length-1] : null;
}
function reviewUnlocked(){
  const n = nowCtx();
  return n.day > CFG.reviewUnlockDay ||
    (n.day === CFG.reviewUnlockDay && n.hour >= CFG.reviewUnlockHour);
}
/* the running week can be judged once the review window opens (or it is reviewed) */
function weekSettled(){
  const wk = currentWeek();
  return !!(wk && wk.reviewedAt) || reviewUnlocked();
}

/* ============================ GRACE ACROSS THE WEEK BOUNDARY ============================ */
/* "Yesterday" is a calendar day, so on a Monday it belongs to the previous ISO
   week. Returns the week+day still inside the grace window, or null. */
function graceTarget(){
  const n = nowCtx();
  if (n.hour >= graceHour()) return null;
  const d = new Date(n.date); d.setDate(d.getDate()-1);
  const key = weekKeyOf(d);
  const day = (d.getDay()+6)%7;
  const wk = state.weeks[key];
  if (!wk || wk.reviewedAt) return null;
  if (day < (wk.committedOnDay||0)) return null;
  return { key, day, wk };
}
function weekHasUnlogged(key, day){
  const wk = state.weeks[key]; if (!wk) return false;
  return wk.goals.some(function(wg){
    const g = state.goals.find(x=>x.id===wg.goalId);
    return g && dayNeedsLog(g, wg, day);
  });
}

/* ============================ RESOLVER ON OPEN ============================ */
function sweepOnOpen(){
  const n = nowCtx();
  const ck = currentWeekKey();
  const g = graceTarget();
  Object.keys(state.weeks).forEach(function(k){
    const wk = state.weeks[k];
    if (wk.reviewedAt) return;
    if (k === ck){ resolveWeek(state.goals, wk, n); return; }
    // a prior unreviewed week was never swept at all: everything past resolves,
    // except a day that is still inside the grace window
    if (k < ck) resolvePastWeek(state.goals, wk, (g && g.key===k) ? g.day : null);
  });
  save();
}
function resolvePastWeek(goals, wk, exemptDay){
  const startDay = wk.committedOnDay || 0;
  for (const wg of wk.goals){
    const g = goals.find(x=>x.id===wg.goalId); if (!g) continue;
    for (let d=startDay; d<7; d++){
      if (d === exemptDay) continue;
      if (g.type==="quota" || g.type==="fixed"){
        if (g.type==="fixed" && !wg.snap.days.includes(d) && !invSwapHas(wg,d)) continue;
        if (g.type==="fixed" && invSwapOrigin(wg,d)) continue;
        if (!wg.days[d] || wg.days[d]==="unlogged") wg.days[d] = "resolved";
      }
    }
  }
}

/* ============================ ACHIEVEMENTS ============================ */
/* [id, meaning, stamp glyph]. Per 2.6 the stamp carries mono initials, not the
   full name — long ids overflowed the square. The meaning surfaces in Review. */
const ACH_LIST = [
  ["FIRST","First review done","1"],
  ["SWEEP","All goals HIT","SW"],
  ["DOUBLE","Two SWEEPs running","2×"],
  ["COMEBACK","Missed→HIT next week","CB"],
  ["HONEST","Every day logged","HN"],
  ["NO-SPARE","Quota 7/7, T≤5","NS"],
  ["EARLY","Pool cleared by Fri","EA"],
  ["STEADY","4 reviews running","ST"],
];
function achGlyph(id){ const a = ACH_LIST.find(x=>x[0]===id); return a ? a[2] : id.slice(0,2); }
/* Evaluate achievements at review-commit of week `key`. Returns list newly earned. */
function evalAchievements(key){
  const earned = [];
  const w = state.weeks[key];
  const verdicts = w.goals.map(function(wg){
    const g = state.goals.find(x=>x.id===wg.goalId);
    return { wg, g, v: g ? goalVerdict(g.type, wg.snap, wg) : "MISS" };
  });
  const grant = function(id){ if (!state.achievements[id]){ state.achievements[id]=key; earned.push(id); } };

  // FIRST — first review completed
  if (Object.keys(state.weeks).filter(k=>state.weeks[k].reviewedAt).length === 0) grant("FIRST");

  const allHit = verdicts.length>0 && verdicts.every(x=>x.v==="HIT");
  if (allHit) grant("SWEEP");

  // DOUBLE — two consecutive SWEEP weeks
  if (allHit){
    const pk = prevWeekKey(key);
    const pw = state.weeks[pk];
    if (pw && pw.reviewedAt && weekWasSweep(pk)) grant("DOUBLE");
  }

  // COMEBACK — a goal missed week N, HIT week N+1
  const pk = prevWeekKey(key);
  const pw = state.weeks[pk];
  if (pw){
    for (const x of verdicts){
      if (x.v!=="HIT") continue;
      const prev = pw.goals.find(p=>p.goalId===x.wg.goalId);
      if (prev){
        const pg = state.goals.find(g=>g.id===prev.goalId);
        if (pg && goalVerdict(pg.type, prev.snap, prev)==="MISS"){ grant("COMEBACK"); break; }
      }
    }
  }

  // HONEST — every in-play day logged before grace expiry ⇒ zero resolved days anywhere
  let anyResolved=false, anyUnlogged=false;
  const startDay = w.committedOnDay||0;
  for (const wg of w.goals){
    const g = state.goals.find(x=>x.id===wg.goalId); if (!g) continue;
    if (g.type==="quota"||g.type==="fixed"){
      const sched = g.type==="fixed"? wg.snap.days : range(startDay,7);
      for (const d of sched){
        const st = wg.days[d];
        if (st==="resolved") anyResolved=true;
        if (!st || st==="unlogged") anyUnlogged=true;
      }
    }
  }
  if (!anyResolved && !anyUnlogged && w.goals.length>0) grant("HONEST");

  // NO-SPARE — a quota with T≤5 logged 7/7 hits
  for (const x of verdicts){
    if (x.g && x.g.type==="quota" && x.wg.snap.target<=5){
      const m = quotaMath(x.wg.snap.target, x.wg.days, x.wg.snap.dip||7);
      if (m.hits===7) grant("NO-SPARE");
    }
  }
  // EARLY — pool cleared by Friday
  for (const x of verdicts){
    if (x.g && x.g.type==="pool"){
      const done = x.wg.poolDone||{};
      const allDoneByFri = x.wg.snap.items.every(function(_,i){ return done[i]!=null && done[i]<=4; });
      if (x.wg.snap.items.length>0 && allDoneByFri) grant("EARLY");
    }
  }
  // STEADY — 4 consecutive reviews (this one incl.)
  if (consecutiveReviews(key) >= 4) grant("STEADY");

  return earned;
}
function achName(id){ const a = ACH_LIST.find(x=>x[0]===id); return a ? a[1] : id; }
function weekWasSweep(key){
  const w = state.weeks[key]; if (!w) return false;
  if (w.goals.length===0) return false;
  return w.goals.every(function(wg){
    const g = state.goals.find(x=>x.id===wg.goalId);
    return g && goalVerdict(g.type, wg.snap, wg)==="HIT";
  });
}
function consecutiveReviews(key){
  let n=0, k=key;
  while (state.weeks[k] && state.weeks[k].reviewedAt){ n++; k=prevWeekKey(k); }
  return n;
}
function range(a,b){ const r=[]; for(let i=a;i<b;i++) r.push(i); return r; }

/* ============================ REVIEW RULE TABLE ============================ */
/* Returns suggested decision chip id for a goal at review time. */
function suggestDecision(g, wg, key){
  if (g.type==="quota"){
    const m = quotaMath(wg.snap.target, wg.days, wg.snap.dip||7);
    // R1
    if (m.verdict==="MISS" && m.misses >= m.sparesTotal + 2) return {chip:"adjust", hint:"target-down", sub:"−1"};
    // R2 — HIT using 0 spares, 2 weeks running
    if (m.verdict==="HIT" && m.sparesLeft===0 && quotaZeroSpareStreak(g, key)>=2 && wg.snap.target<7)
      return {chip:"adjust", hint:"target-up", sub:"raise"};
  }
  if (g.type==="pool"){
    const rem = poolRemaining(wg.snap, wg);
    // R3 — ≥2 items never done
    if (rem >= 2) return {chip:"adjust", hint:"pool-remove", sub:"−1 item"};
    // R4 — cleared by Friday 2 weeks running
    if (rem===0 && poolEarlyStreak(g, key)>=2) return {chip:"adjust", hint:"pool-add", sub:"+1 item"};
  }
  if (g.type==="fixed"){
    // R5 — same weekday missed 2 consecutive weeks
    const wd = fixedRepeatMissDay(g, wg, key);
    if (wd!=null) return {chip:"adjust", hint:"fixed-move", sub:"move "+DAYS[wd]};
  }
  if (g.type==="counter"){
    const m = counterMath(wg.snap.perDay, wg.snap.daysTarget, wg.counts);
    if (m.daysHit <= 3) return {chip:"adjust", hint:"counter-down", sub:"−1/day"};
  }
  // R7 — HIT 3 consecutive weeks => Park (mastered)
  if (goalVerdict(g.type, wg.snap, wg)==="HIT" && hitStreak(g, key)>=3)
    return {chip:"park", hint:"mastered", sub:"mastered"};
  return {chip:"keep", hint:null, sub:null};
}
function quotaZeroSpareStreak(g, key){
  let n=0, k=key;
  while (state.weeks[k]){
    const wg = state.weeks[k].goals.find(x=>x.goalId===g.id);
    if (!wg || wg.snap.target==null) break;
    const m = quotaMath(wg.snap.target, wg.days, wg.snap.dip||7);
    if (m.verdict==="HIT" && m.sparesLeft===0) n++; else break;
    k = prevWeekKey(k);
  }
  return n;
}
function poolEarlyStreak(g, key){
  let n=0, k=key;
  while (state.weeks[k]){
    const wg = state.weeks[k].goals.find(x=>x.goalId===g.id);
    if (!wg || !wg.snap.items) break;
    const done = wg.poolDone||{};
    const early = wg.snap.items.every((_,i)=>done[i]!=null && done[i]<=4);
    if (early) n++; else break;
    k = prevWeekKey(k);
  }
  return n;
}
function fixedRepeatMissDay(g, wg, key){
  const pk = prevWeekKey(key);
  const pw = state.weeks[pk];
  if (!pw) return null;
  const pwg = pw.goals.find(x=>x.goalId===g.id);
  if (!pwg) return null;
  const missNow = fixedInstances(wg.snap.days, wg.days, wg.swaps).filter(i=>i.state!=="hit").map(i=>i.origin);
  const missPrev = new Set(fixedInstances(pwg.snap.days, pwg.days, pwg.swaps).filter(i=>i.state!=="hit").map(i=>i.origin));
  for (const d of missNow) if (missPrev.has(d)) return d;
  return null;
}
function hitStreak(g, key){
  let n=0, k=key;
  while (state.weeks[k]){
    const wg = state.weeks[k].goals.find(x=>x.goalId===g.id);
    if (!wg) break;
    const gg = state.goals.find(x=>x.id===g.id);
    if (gg && goalVerdict(gg.type, wg.snap, wg)==="HIT") n++; else break;
    k = prevWeekKey(k);
  }
  return n;
}

/* ============================ TIPS ENGINE ============================ */
/* state-triggered, one slot, priority order, cooldown. Returns {id,text} or null. */
function pickTip(){
  const wk = state.weeks[currentWeekKey()];
  if (!wk) return null;
  const n = nowCtx();
  const cands = [];
  const gv = wk.goals.map(function(wg){
    const g = state.goals.find(x=>x.id===wg.goalId); return {g, wg};
  }).filter(x=>x.g);

  // T1 — fixed instance skipped 2× this week
  for (const {g,wg} of gv){
    if (g.type==="fixed"){
      const missed = fixedInstances(wg.snap.days, wg.days, wg.swaps).filter(i=>i.state==="miss"||i.state==="resolved").length;
      if (missed>=2){ cands.push(["T1","Shrink it. 10 min → 5. Small enough to start is the whole trick."]); break; }
    }
  }
  // T2 — pool enters risk
  for (const {g,wg} of gv){
    if (g.type==="pool"){
      const dleft = 6 - n.day;
      if (poolRisk(poolRemaining(wg.snap, wg), dleft)==="risk"){ cands.push(["T2","Split the pile — do the easiest item tonight."]); break; }
    }
  }
  // T3 — counter daysHit/daysElapsed < 0.5 on/after Thu
  if (n.day>=3){
    for (const {g,wg} of gv){
      if (g.type==="counter"){
        const elapsed = Math.max(1, n.day - (wk.committedOnDay||0));
        const m = counterMath(wg.snap.perDay, wg.snap.daysTarget, wg.counts);
        if (m.daysHit/elapsed < 0.5){ cands.push(["T3","Anchor it: one bottle with each meal beats remembering."]); break; }
      }
    }
  }
  // T4 — quota spares gone before Sat
  if (n.day < 5){
    for (const {g,wg} of gv){
      if (g.type==="quota"){
        const m = quotaMath(wg.snap.target, wg.days, wg.snap.dip||7);
        if (m.sparesLeft===0){ cands.push(["T4","Spares gone, week's still live. Protect the days that remain."]); break; }
      }
    }
  }
  // T5 — first active week
  if (Object.keys(state.weeks).length===1) cands.push(["T5","Log honestly. A hatched day teaches more than a fake tick."]);
  // T6 — everything safe on Fri
  if (n.day===4){
    const allSafe = gv.every(function({g,wg}){
      if (g.type==="pool") return poolRisk(poolRemaining(wg.snap,wg), 6-n.day)==="safe";
      return true;
    });
    if (allSafe && gv.length>0) cands.push(["T6","Ahead. Bank a Sunday item today if you fancy."]);
  }
  // T7 — previous week archived unreviewed
  const pk = prevWeekKey(currentWeekKey());
  if (state.weeks[pk] && state.weeks[pk].abandoned) cands.push(["T7","The Sunday review is the whole engine. 90 seconds."]);
  // T8 — ≥3 goals failing/at-risk
  let atRisk=0;
  for (const {g,wg} of gv){
    const v = goalVerdict(g.type, wg.snap, wg);
    if (g.type==="pool" && poolRisk(poolRemaining(wg.snap,wg), 6-n.day)==="risk"){ atRisk++; continue; }
    if (v==="MISS") atRisk++;
  }
  if (atRisk>=3) cands.push(["T8","Overloaded. Parking one goal is a decision, not a failure."]);

  // priority = order in T1..T8 numerically
  cands.sort((a,b)=> a[0].localeCompare(b[0]));
  for (const [id,text] of cands){
    if (isTipDismissed(id)) continue;
    if (isTipOnCooldown(id)) continue;
    return { id, text };
  }
  return null;
}
function isTipDismissed(id){ return dismissedTips.has(id+"@"+currentWeekKey()); }
function isTipOnCooldown(id){
  const wk = state.tips[id];
  if (!wk) return false;
  const shown = mondayOfKey(wk);
  const diff = (mondayOf(now()) - shown)/(24*3600*1000);
  return diff < CFG.tipCooldownDays;
}
const dismissedTips = new Set();

/* ---- week strip component: the signature element ---- */
function buildStrip(g, wg, opts){
  opts = opts || {};
  const strip = el("div","strip");
  const startDay = wg._startDay != null ? wg._startDay : (currentWeek()? currentWeek().committedOnDay : 0);
  const n = nowCtx();
  const swapDest = {}; for (const o in (wg.swaps||{})) swapDest[wg.swaps[o]] = o;
  for (let d=0; d<7; d++){
    // only today's cell is ever tappable; the rest are read-only marks, so they
    // are drawn as plain divs and stay out of the tab order
    // today, plus yesterday while the grace window is open
    const graceDay = (n.hour < graceHour() && n.day-1 >= startDay) ? n.day-1 : -1;
    const editableDay = (d===n.day || d===graceDay);
    let tappable = false;
    if (opts.interactive && editableDay){
      if (g.type==="quota") tappable = true;
      else if (g.type==="fixed"){
        const here = wg.snap.days.includes(d) && !(wg.swaps||{})[d];
        const holdsMoved = swapDest[d] != null;
        // a scheduled day, a day already holding a moved session, or a free
        // off-day while an instance is still owed
        tappable = here || holdsMoved ||
          (!wg.snap.days.includes(d) && outstandingFixedInstance(wg) != null);
      }
    }
    const cell = el(tappable ? "button" : "div", "cell");
    cell.setAttribute("aria-label", DAY_FULL[d]);
    const lab = el("span","d mono", DAY_INI[d]); cell.appendChild(lab);

    const inPlay = d >= startDay;
    if (!inPlay){ cell.classList.add("nip"); strip.appendChild(cell); continue; }
    if (d===n.day) cell.classList.add("today");

    let st = "future";
    if (g.type==="quota"){
      st = d > n.day ? "future" : (wg.days[d] || "unlogged");
    } else if (g.type==="fixed"){
      const scheduled = wg.snap.days.includes(d);
      const isDest = swapDest[d]!=null;
      const movedAway = (wg.swaps||{})[d]!=null;
      if (movedAway){ st="moved"; }
      else if (scheduled || isDest){ st = wg.days[d] || (d>n.day?"future":"unlogged"); if (isDest) cell.classList.add("dest"); }
      else { st = "blank"; }
    } else if (g.type==="counter"){
      const c = wg.counts[d];
      if (c==null){ st = d>n.day?"future":"unlogged"; }
      else st = c>=wg.snap.perDay ? "hit" : "miss";
    } else if (g.type==="pool"){
      // a pool day reads as done when at least one item was checked off on it
      let doneHere = false;
      for (const i in (wg.poolDone||{})) if (wg.poolDone[i]===d){ doneHere = true; break; }
      st = doneHere ? "hit" : (d > n.day ? "future" : "unlogged");
    }
    applyCellState(cell, st, g, wg, d);

    if (tappable){
      cell.classList.add("tap");
      if (g.type==="fixed" && st==="blank"){
        const plus = el("span","glyph plus","+"); cell.appendChild(plus);
      }
      cell.addEventListener("click", function(){
        if (g.type==="fixed") toggleFixedDay(g, wg, d);
        else toggleDay(g, wg, d, cell);
      });
    }
    strip.appendChild(cell);
  }
  return strip;
}
function applyCellState(cell, st, g, wg, d){
  if (st==="hit"){ cell.classList.add("hit"); cell.appendChild(checkGlyph()); }
  else if (st==="miss"){ cell.classList.add("miss"); }
  else if (st==="resolved"){ cell.classList.add("resolved"); }
  else if (st==="moved"){ cell.classList.add("moved"); const a=el("span","glyph","→"); cell.appendChild(a); }
  else if (st==="future"){ cell.classList.add("future"); }
  else if (st==="blank"){ cell.classList.add("blank"); }
  // unlogged => plain surface
}
function checkGlyph(){
  const s = document.createElementNS("http://www.w3.org/2000/svg","svg");
  s.setAttribute("class","glyph"); s.setAttribute("width","16"); s.setAttribute("height","16");
  s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none");
  s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","2.4");
  const p = document.createElementNS("http://www.w3.org/2000/svg","path");
  p.setAttribute("d","M5 13l4 4L19 6"); p.setAttribute("stroke-linecap","square");
  s.appendChild(p); return s;
}

function currentWeek(){ return state.weeks[currentWeekKey()]; }

function toggleFixedDay(g, wg, d){
  const swaps = wg.swaps || (wg.swaps = {});
  const scheduledHere = wg.snap.days.includes(d) && swaps[d] == null;
  const destOrigin = fixedDestOrigin(wg, d);
  if (scheduledHere || destOrigin != null){
    // same cycle as a quota cell: hit -> miss -> clear. Clearing a session that
    // was moved here sends it back to its own day.
    const cur = wg.days[d];
    const next = cur==="hit" ? "miss" : (cur==="miss" ? null : "hit");
    if (next == null){
      delete wg.days[d];
      if (destOrigin != null) delete swaps[destOrigin];
    } else wg.days[d] = next;
    save(); vibrate(8); renderRoot();
    return;
  }
  if (logFixedOffDay(wg, d)){ save(); vibrate(8); renderRoot(); }
}
function toggleDay(g, wg, d, cell){
  const cur = wg.days[d];
  const next = cur==="hit" ? "miss" : (cur==="miss" ? "unlogged" : "hit");
  if (next==="unlogged") delete wg.days[d]; else wg.days[d]=next;
  save();
  vibrate(8);
  renderToday();
}

/* ---- goal row on Today ---- */
function goalRowToday(g, wg){
  const n = nowCtx();
  const row = el("div","grow");
  const top = el("div","top");
  const left = el("div");
  left.appendChild(el("div","name", g.name));
  left.appendChild(metaLine(g, wg));
  top.appendChild(left);
  row.appendChild(top);

  const ctl = el("div","ctl");
  if (g.type==="quota"){
    ctl.appendChild(buildStrip(g, wg, {interactive:true}));
  } else if (g.type==="counter"){
    ctl.appendChild(counterControl(g, wg));
  } else if (g.type==="pool"){
    const rem = poolRemaining(wg.snap, wg);
    const dleft = 6 - n.day;
    const risk = poolRisk(rem, dleft);
    if (risk==="risk"){ row.classList.add("risk"); }
    ctl.appendChild(poolControl(g, wg));
    if (risk==="tight" || risk==="risk"){
      const nud = el("div","nudge", risk==="risk"
        ? rem+" left, "+dleft+" days after today — split the pile."
        : rem+" left for "+dleft+" days — no slack now.");
      ctl.appendChild(nud);
    }
  } else if (g.type==="fixed"){
    const scheduledToday = wg.snap.days.includes(n.day) && !(wg.swaps||{})[n.day];
    ctl.appendChild(buildStrip(g, wg, {interactive:true}));
    if (scheduledToday){
      const btn = el("button","btn primary sm","Log "+(wg.snap.label||"done"));
      btn.style.marginTop="10px"; btn.style.width="auto";
      btn.addEventListener("click", function(){ wg.days[n.day]="hit"; save(); vibrate(8); renderToday(); });
      if (wg.days[n.day]==="hit"){ btn.textContent="Logged"; btn.classList.remove("primary"); btn.classList.add("quiet"); }
      ctl.appendChild(btn);
    }
  }
  row.appendChild(ctl);
  return row;
}
function metaLine(g, wg){
  const m = el("div","meta caps");
  const n = nowCtx();
  if (g.type==="quota"){
    const q = quotaMath(wg.snap.target, wg.days, wg.snap.dip||7);
    let s = "QUOTA · "+q.hits+"/"+wg.snap.target;
    if (q.over>0){ m.innerHTML = "QUOTA · "+q.hits+"/"+wg.snap.target+" · <span class='over'>OVER BY "+q.over+"</span>"; return m; }
    s += " · "+Math.max(0,q.sparesLeft)+" SPARE";
    m.textContent = s;
  } else if (g.type==="counter"){
    const today = wg.counts[n.day]||0;
    const cm = counterMath(wg.snap.perDay, wg.snap.daysTarget, wg.counts);
    m.textContent = "COUNTER · TODAY "+today+"/"+wg.snap.perDay+" · DAYS "+cm.daysHit+"/"+wg.snap.daysTarget;
  } else if (g.type==="pool"){
    const rem = poolRemaining(wg.snap, wg);
    const done = wg.snap.items.length - rem;
    m.textContent = "POOL · "+done+"/"+wg.snap.items.length+" DONE";
  } else if (g.type==="fixed"){
    const inst = fixedInstances(wg.snap.days, wg.days, wg.swaps);
    const hit = inst.filter(i=>i.state==="hit").length;
    m.textContent = "FIXED · "+hit+"/"+inst.length+(wg.snap.label?(" · "+wg.snap.label):"");
  }
  return m;
}
function counterControl(g, wg){
  const n = nowCtx();
  const wrap = el("div"); wrap.style.display="flex"; wrap.style.alignItems="center";
  const step = el("div","stepper");
  const minus = el("button","step-btn","−"); minus.setAttribute("aria-label","decrease");
  const val = el("div","step-val");
  const plus = el("button","step-btn","+"); plus.setAttribute("aria-label","increase");
  const cur = wg.counts[n.day]||0;
  val.textContent = cur+"/"+wg.snap.perDay;
  minus.addEventListener("click", function(){ setCount(g,wg,n.day,Math.max(0,(wg.counts[n.day]||0)-1)); });
  plus.addEventListener("click", function(){ setCount(g,wg,n.day,(wg.counts[n.day]||0)+1); });
  step.appendChild(minus); step.appendChild(val); step.appendChild(plus);
  wrap.appendChild(step);
  return wrap;
}
function setCount(g, wg, d, v){
  wg.counts[d]=v; save(); vibrate(8); renderToday();
}
function poolControl(g, wg){
  const n = nowCtx();
  const pool = el("div","pool");
  wg.snap.items.forEach(function(it, i){
    const done = wg.poolDone[i]!=null;
    const row = el("div","pitem"+(done?" done":""));
    const box = el("button","pbox"+(done?" on":""));
    box.setAttribute("aria-label", it.name);
    if (done) box.appendChild(checkGlyph());
    box.addEventListener("click", function(){
      if (wg.poolDone[i]!=null) delete wg.poolDone[i];
      else wg.poolDone[i]=n.day;
      save(); vibrate(8); renderToday();
    });
    const name = el("div","pname", it.name);
    // the checked box already says "done"; the chip only carries the day, so the
    // column keeps one width and one meaning
    const chip = el("button","daychip"+(done?" done":""),
      (done ? DAYS[wg.poolDone[i]] : DAYS[it.suggestedDay]).toUpperCase());
    chip.addEventListener("click", function(e){ e.stopPropagation(); reassignPoolDay(g,wg,i); });
    row.appendChild(box); row.appendChild(name); row.appendChild(chip);
    pool.appendChild(row);
  });
  return pool;
}
function reassignPoolDay(g, wg, i){
  const it = wg.snap.items[i];
  it.suggestedDay = (it.suggestedDay+1)%6; // cycle Mon..Sat
  save(); renderToday();
}

/* ---- TODAY ---- */
function renderToday(){
  const scr = document.getElementById("today-screen");
  scr.innerHTML = "";
  const ph = phase();
  const n = nowCtx();

  if (ph.mode==="planning" || !currentWeek()){ renderPlanningInto(scr); return; }

  // Signal-orange budget: the Sunday review banner outranks the tip slot, so
  // Today never stacks two orange advisory strips.
  const showReview = reviewUnlocked() && currentWeek().reviewedAt==null;

  // tip slot
  const tip = showReview ? null : pickTip();
  if (tip){
    const t = el("div","tip");
    const body = el("div","body");
    body.appendChild(el("div","lbl caps","Tip"));
    body.appendChild(el("div","txt", tip.text));
    const x = el("button","x","×"); x.setAttribute("aria-label","Dismiss tip");
    x.addEventListener("click", function(){
      dismissedTips.add(tip.id+"@"+currentWeekKey());
      state.tips[tip.id]=currentWeekKey(); save(); renderToday();
    });
    t.appendChild(body); t.appendChild(x);
    scr.appendChild(t);
  }

  const wk = currentWeek();
  const active = wk.goals.filter(function(wg){ const g=state.goals.find(x=>x.id===wg.goalId); return g && g.status==="active"; });

  // yesterday grace section
  if (n.hour < graceHour() && n.day-1 >= (wk.committedOnDay||0)){
    const yday = n.day-1;
    // "editable until HH:MM" means changeable, not fillable-once, so an already
    // logged yesterday is listed too
    const needing = active.filter(function(wg){ return dayInPlay(state.goals.find(x=>x.id===wg.goalId), wg, yday); });
    if (needing.length){
      scr.appendChild(el("div","sec-head",STR.yesterdayOpen+fmtHour(graceHour())));
      const rec = el("div","recessed rows");
      needing.forEach(function(wg){
        const g = state.goals.find(x=>x.id===wg.goalId);
        rec.appendChild(yesterdayRow(g, wg, yday));
      });
      scr.appendChild(rec);
    }
  }

  // goals
  if (active.length===0){
    scr.appendChild(el("div","empty",STR.noGoals));
  } else {
    const rows = el("div","rows");
    active.forEach(function(wg){
      const g = state.goals.find(x=>x.id===wg.goalId);
      rows.appendChild(goalRowToday(g, wg));
    });
    scr.appendChild(rows);
  }

  // sunday review banner
  if (showReview){
    const b = el("div","tip"); b.style.borderLeftColor="var(--signal)";
    const body = el("div","body");
    body.appendChild(el("div","lbl caps","Review"));
    body.appendChild(el("div","txt",STR.reviewReady));
    b.appendChild(body);
    const go = el("button","btn commit sm","Open"); go.style.width="auto"; go.style.alignSelf="center";
    go.addEventListener("click", function(){ openReview(currentWeekKey(), false); });
    b.appendChild(go);
    scr.appendChild(b);
  }
}
/* a goal has something to log OR change on this day (pool has no per-day mark) */
function dayInPlay(g, wg, d){
  if (!g) return false;
  if (g.type==="quota" || g.type==="counter") return true;
  if (g.type==="fixed") return wg.snap.days.includes(d) && !(wg.swaps||{})[d];
  return false;
}
function dayNeedsLog(g, wg, d){
  if (!g) return false;
  if (g.type==="quota") return !wg.days[d];
  if (g.type==="fixed") return wg.snap.days.includes(d) && !(wg.swaps||{})[d] && !wg.days[d];
  if (g.type==="counter") return wg.counts[d]==null;
  return false;
}
function yesterdayRow(g, wg, d){
  const row = el("div","grow");
  const top = el("div","top");
  const left = el("div");
  left.appendChild(el("div","name", g.name));
  const cur = wg.days[d];
  let note = DAYS[d].toUpperCase()+" — still open";
  if (g.type==="counter") note = DAYS[d].toUpperCase()+" · "+(wg.counts[d]!=null?wg.counts[d]:0)+"/"+wg.snap.perDay;
  else if (cur==="hit") note = DAYS[d].toUpperCase()+" · HIT";
  else if (cur==="miss") note = DAYS[d].toUpperCase()+" · MISS";
  else if (cur==="resolved") note = DAYS[d].toUpperCase()+" · UNLOGGED";
  left.appendChild(el("div","meta caps", note));
  top.appendChild(left);
  row.appendChild(top);
  const ctl = el("div","ctl");
  if (g.type==="quota" || g.type==="fixed"){
    // the current value is shown as selected, and either button can change it
    const yes = el("button","btn sm "+(cur==="hit"?"primary":"quiet"),"Hit"); yes.style.width="auto";
    const no  = el("button","btn sm "+(cur==="miss"?"primary":"quiet"),"Miss"); no.style.width="auto";
    yes.addEventListener("click", function(){ wg.days[d]="hit"; save(); vibrate(8); renderRoot(); });
    no.addEventListener("click", function(){ wg.days[d]="miss"; save(); vibrate(8); renderRoot(); });
    const bar = el("div","btnrow"); bar.appendChild(yes); bar.appendChild(no);
    ctl.appendChild(bar);
  } else if (g.type==="counter"){
    ctl.appendChild(counterControlForDay(g, wg, d));
  }
  row.appendChild(ctl);
  return row;
}
function counterControlForDay(g, wg, d){
  const wrap = el("div"); wrap.style.display="flex"; wrap.style.alignItems="center";
  const step = el("div","stepper");
  const minus = el("button","step-btn","−");
  const val = el("div","step-val");
  const plus = el("button","step-btn","+");
  const draw = function(){ val.textContent=(wg.counts[d]||0)+"/"+wg.snap.perDay; };
  draw();
  minus.addEventListener("click", function(){ wg.counts[d]=Math.max(0,(wg.counts[d]||0)-1); save(); renderRoot(); });
  plus.addEventListener("click", function(){ wg.counts[d]=(wg.counts[d]||0)+1; save(); renderRoot(); });
  step.appendChild(minus); step.appendChild(val); step.appendChild(plus);
  wrap.appendChild(step);
  return wrap;
}

/* ---- WEEK / PLANNER ---- */
function renderWeek(){
  const scr = document.getElementById("week-screen");
  scr.innerHTML = "";
  const ph = phase();
  if (ph.mode==="planning" || !currentWeek()){ renderPlanningInto(scr); return; }
  const wk = currentWeek();
  scr.appendChild(el("div","sec-head","The week"));
  const table = el("div","rows wtable");
  const active = wk.goals.filter(function(wg){ const g=state.goals.find(x=>x.id===wg.goalId); return g && g.status==="active"; });
  active.forEach(function(wg){
    const g = state.goals.find(x=>x.id===wg.goalId);
    table.appendChild(weekRow(g, wg));
  });
  scr.appendChild(table);

  // add goal
  const addBtn = el("button","btn add",STR.addGoal); addBtn.style.marginTop="18px";
  const activeCount = state.goals.filter(g=>g.status==="active").length;
  if (slotAction(activeCount)==="blocked"){ addBtn.disabled=true; }
  addBtn.addEventListener("click", function(){ onAddGoal(); });
  scr.appendChild(addBtn);
  if (slotAction(activeCount)==="blocked"){
    scr.appendChild(el("div","empty",STR.hardCap));
  }
}
let expandedGoal = null;
function weekRow(g, wg){
  const row = el("div","grow");
  const top = el("div","top");
  const left = el("div");
  left.appendChild(el("div","name", g.name));
  left.appendChild(metaLine(g, wg));
  top.appendChild(left);
  // A verdict is only true once the week can be judged. Mid-week every goal
  // would otherwise show a MISS hatch, which is both premature and grim.
  const v = el("div");
  v.appendChild(weekSettled() ? verdictTok(goalVerdict(g.type,wg.snap,wg)) : paceTok(g, wg));
  top.appendChild(v);
  row.appendChild(top);

  const sw = el("div","stripwrap");
  wg._startDay = currentWeek().committedOnDay||0;
  sw.appendChild(buildStrip(g, wg, {interactive:false}));
  row.appendChild(sw);

  row.addEventListener("click", function(e){
    if (e.target.closest(".detail")) return;
    expandedGoal = expandedGoal===g.id? null : g.id;
    renderWeek();
  });
  if (expandedGoal===g.id){ row.appendChild(weekDetail(g, wg)); }
  return row;
}
/* status slot for a week still in play — undecided, not a failure */
function paceTok(g, wg){ return el("div","vtok pending"); }
function verdictTok(v){
  const t = el("div","vtok "+(v==="HIT"?"hit":"miss"));
  if (v==="HIT") t.appendChild(checkGlyph());
  return t;
}
function weekDetail(g, wg){
  const d = el("div","detail");
  d.addEventListener("click", function(e){ e.stopPropagation(); });
  // editing fields

function onAddGoal(){
  const activeCount = state.goals.filter(g=>g.status==="active").length;
  const act = slotAction(activeCount);
  if (act==="blocked"){ return; }
  if (act==="friction"){
    const body = el("div");

    addBtn.addEventListener("click", function(){ closeSheet(); newGoalSheet(); });

  newGoalSheet();
}

function createGoalOfType(type){
  const id = "g"+Date.now().toString(36);
  const wk = currentWeekKey();
  let params;
  let name;
  if (type==="quota"){ params={target:5}; name="New quota"; }
  else if (type==="pool"){ params={items:[{name:"item 1"},{name:"item 2"}]}; name="New pool"; }
  else if (type==="counter"){ params={perDay:3, daysTarget:7}; name="New counter"; }
  else { params={days:[0,2,4], label:""}; name="New fixed"; }
  const g = { id, type, name, params, status:"active", createdWeek:wk };
  state.goals.push(g);
  addGoalToCurrentWeek(g);
  save();
  expandedGoal = id;
  showTab("week");
  editGoalName(g);
}
function addGoalToCurrentWeek(g){
  const wk = currentWeek(); if (!wk) return;
  if (wk.goals.find(x=>x.goalId===g.id)) return;
  const snap = snapshotParams(g, wk.committedOnDay||0, daysInPlay(wk.committedOnDay||0));
  wk.goals.push({ goalId:g.id, snap, days:{}, swaps:{}, counts:{}, poolDone:{}, verdict:null });
}

function plural(n, one, many){ return n+" "+(n===1?one:many); }
function diagnostic(g, wg, v){
  if (g.type==="quota"){
    const m = quotaMath(wg.snap.target, wg.days, wg.snap.dip||7);
    if (v==="HIT"){
      return m.hits+" of "+wg.snap.target+" days." +
        (m.sparesLeft>0 ? " "+plural(m.sparesLeft,"spare","spares")+" unused." : " No spare left.");
    }
    if (m.over>0) return m.hits+" of "+wg.snap.target+" days — over by "+m.over+".";
    return m.hits+" of "+wg.snap.target+" days — "+(wg.snap.target-m.hits)+" short.";
  }
  if (g.type==="counter"){
    const m = counterMath(wg.snap.perDay, wg.snap.daysTarget, wg.counts);
    if (v==="HIT") return m.daysHit+" of "+wg.snap.daysTarget+" days met.";
    return m.daysHit+" of "+wg.snap.daysTarget+" days met — "+(wg.snap.daysTarget-m.daysHit)+" short.";
  }
  if (g.type==="pool"){
    const rem = poolRemaining(wg.snap, wg);
    return rem===0 ? "Cleared — every item done." : plural(rem,"item","items")+" left undone.";
  }
  if (g.type==="fixed"){
    const inst = fixedInstances(wg.snap.days, wg.days, wg.swaps);
    if (v==="HIT") return "All "+plural(inst.length,"session","sessions")+" logged.";
    const miss = inst.filter(i=>i.state!=="hit").map(i=>DAYS[i.origin]);
    return "Missed "+miss.join(", ")+".";
  }
  return "";
}
function adjustSheet(g, suggest){
  const body = el("div");
  body.appendChild(el("h2",null,"Adjust — "+g.name));
  if (g.type==="quota"){
    body.appendChild(numField("Target /7", g.params.target,1,7,function(v){ g.params.target=v; }));
  } else if (g.type==="counter"){
    body.appendChild(numField("Per day", g.params.perDay,1,CFG.counterMax,function(v){ g.params.perDay=v; }));
    body.appendChild(numField("Days /7", g.params.daysTarget,1,7,function(v){ g.params.daysTarget=v; }));
  } else if (g.type==="fixed"){
    body.appendChild(dayPicker(g.params.days,function(days){ g.params.days=days; }));
  } else if (g.type==="pool"){
    const b = el("button","btn quiet","Edit items"); b.addEventListener("click",()=>{closeSheet(); editGoalName(g);});
    body.appendChild(b);
  }
  const ok = el("button","btn primary","Apply"); ok.style.marginTop="14px";
  ok.addEventListener("click", function(){ save(); closeSheet(); renderReview(); });
  body.appendChild(ok);
  openSheet(body);
}
function commitReview(){
  const wk = state.weeks[reviewKey];
  // persist achievements earned this week
  evalAchievements(reviewKey);
  wk.reviewedAt = now().toISOString();
  wk.decisions = Object.assign({}, reviewDecisions);
  // apply decisions to goals (adjust already mutated params via the sheet)
  for (const gid in reviewDecisions){
    const g = state.goals.find(x=>x.id===gid); if (!g) continue;
    const d = reviewDecisions[gid];
    if (d==="park") g.status="parked";
    else if (d==="drop") g.status="dropped";
  }
  const ck = currentWeekKey();
  const n = nowCtx();
  if (reviewKey === ck){
    // normal same-week Sunday review: seed the next ISO week as a full week
    const nextKey = nextWeekKeyFrom(reviewKey);
    if (!state.weeks[nextKey]){
      const nw = buildWeek(0); nw.committedOnDay = 0;
      state.weeks[nextKey] = nw;
    }
  } else {
    // rollover catch-up: archive any older skipped weeks, seed the current week prorated
    Object.keys(state.weeks).forEach(function(k){
      if (k < ck && k !== reviewKey && state.weeks[k].reviewedAt==null && !state.weeks[k].abandoned)
        state.weeks[k].abandoned = true;
    });
    if (!state.weeks[ck]){
      const nw = buildWeek(n.day);
      state.weeks[ck] = nw;
      resolveWeek(state.goals, nw, n);
    }
  }
  save();
  closeReview();
  // another prior week may still need catch-up review; renderRoot re-checks
  activeTab="today";
  renderRoot();
}
function nextWeekKeyFrom(key){
  const mon = mondayOfKey(key); mon.setDate(mon.getDate()+7); return weekKeyOf(mon);
}
function closeReview(){
  document.getElementById("review-screen").classList.remove("on");
  document.getElementById("nav").style.display="flex";
}
/* provisional achievements for display (no persist) */
function provisionalAchievements(key){
  const snapshot = JSON.stringify(state.achievements);
  const before = Object.assign({}, state.achievements);
  const list = evalAchievements(key);
  state.achievements = before; // roll back persistence side-effect
  return list;
}
