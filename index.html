  wipe.addEventListener("click", wipeFlow);
  r4.appendChild(wipe);
  body.appendChild(r4);

  openSheet(body);
}
function hourRow(label, note, get, set, lo, hi, step){
  const row = el("div","row");
  const left = el("div");
  left.appendChild(el("div",null,label));
  if (note) left.appendChild(el("div","rownote", note));
  row.appendChild(left);
  const val = el("div","step-val hour", fmtHour(get()));
  const box = el("div","stepper compact");
  const dn = el("button","step-btn","−"); dn.setAttribute("aria-label","decrease "+label);
  const up = el("button","step-btn","+"); up.setAttribute("aria-label","increase "+label);
  const bump = function(d){ set(clamp(get()+d, lo, hi)); val.textContent = fmtHour(get()); save(); };
  dn.addEventListener("click", function(){ bump(-step); });
  up.addEventListener("click", function(){ bump(step); });
  box.appendChild(dn); box.appendChild(val); box.appendChild(up);
  row.appendChild(box);
  return row;
}
function fmtHour(h){ const H=Math.floor(h); const M=(h-H)*60; return String(H).padStart(2,"0")+":"+String(M).padStart(2,"0"); }
function exportDownload(){
  const data = JSON.stringify(state, null, 2);
  const blob = new Blob([data], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download="week-"+currentWeekKey()+".json";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function exportCopy(){
  const data = JSON.stringify(state, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(data); }
  else {
    const ta=document.createElement("textarea"); ta.value=data; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){} ta.remove();
  }
}
function importPick(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.addEventListener("change", function(){
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      try{
        const parsed = JSON.parse(rd.result);
        if (parsed.schemaVersion !== CFG.schemaVersion){ alert("Schema mismatch — cannot import (expected v"+CFG.schemaVersion+")."); return; }
        if (!confirm("Import will overwrite all current data. Continue?")) return;
        state = parsed; save(); closeSheet(); renderRoot();
      }catch(e){ alert("Invalid JSON file."); }
    };
    rd.readAsText(f);
  });
  inp.click();
}
function wipeFlow(){
  const body = el("div");
  body.appendChild(el("h2",null,"Wipe everything"));
  body.appendChild(el("p",null,"This deletes all goals, weeks and trophies. Type WIPE to confirm."));
  const input = document.createElement("input"); input.className="txtin";
  body.appendChild(input);
  const go = el("button","btn primary","Wipe"); go.style.marginTop="14px"; go.disabled=true;
  input.addEventListener("input", function(){ go.disabled = input.value.trim()!=="WIPE"; });
  go.addEventListener("click", function(){
    if (!confirm("Last chance — really wipe all data?")) return;
    if (STORE_OK) localStorage.removeItem(CFG.storageKey);
    state = seedState(); save(); closeSheet(); renderRoot();
  });
  body.appendChild(go);
  openDialog(body);
}

/* ---- sheet / dialog plumbing ---- */
const scrim = document.getElementById("scrim");
function closeGlyph(){
  const x = el("button","panel-x","×");
  x.setAttribute("aria-label","Close");
  x.addEventListener("click", closeSheet);
  return x;
}
function openSheet(body){
  scrim.className = "scrim on";
  scrim.innerHTML = "";
  const s = el("div","sheet"); s.appendChild(closeGlyph()); s.appendChild(body);
  scrim.appendChild(s);
  scrim.onclick = function(e){ if (e.target===scrim) closeSheet(); };
}
function openDialog(body){
  scrim.className = "scrim on center";
  scrim.innerHTML = "";
  const s = el("div","dialog"); s.appendChild(closeGlyph()); s.appendChild(body);
  scrim.appendChild(s);
  scrim.onclick = function(e){ if (e.target===scrim) closeSheet(); };
}
function closeSheet(){ scrim.className="scrim"; scrim.innerHTML=""; }

/* ---- tabs ---- */
function showTab(tab){
  activeTab = tab;
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  if (tab==="today"){ document.getElementById("today-screen").classList.add("on"); renderToday(); }
  else if (tab==="week"){ document.getElementById("week-screen").classList.add("on"); renderWeek(); }
  else if (tab==="trophies"){ document.getElementById("trophies-screen").classList.add("on"); renderTrophies(); }
}
function renderRoot(){
  renderBanner();
  renderHeader();
  // rollover: a prior committed-but-unreviewed week forces the Review screen first
  const ph = phase();
  if (ph.mode==="grace"){ renderGrace(ph); return; }
  if (ph.mode==="review" && ph.forced){
    openReview(ph.key, true);
    return;
  }
  showTab(activeTab);
}

/* ---- catch-up: finish the still-open day, then review ---- */
function renderGrace(ph){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  const scr = document.getElementById("today-screen");
  scr.classList.add("on");
  document.getElementById("nav").style.display="none";
  scr.innerHTML = "";
  const wk = state.weeks[ph.key];
  scr.appendChild(el("div","sec-head", STR.yesterdayOpen+fmtHour(graceHour())));
  scr.appendChild(el("div","meta caps",
    DAY_FULL[ph.day].toUpperCase()+" · "+weekLabel(mondayOfKey(ph.key))));
  const rec = el("div","recessed rows"); rec.style.marginTop="12px";
  wk.goals.forEach(function(wg){
    const g = state.goals.find(x=>x.id===wg.goalId);
    if (g && dayInPlay(g, wg, ph.day)) rec.appendChild(yesterdayRow(g, wg, ph.day));
  });
  scr.appendChild(rec);
  const go = el("button","btn commit","Review week "+isoInfo(mondayOfKey(ph.key)).week+" →");
  go.style.marginTop="24px";
  go.addEventListener("click", function(){ openReview(ph.key, true); });
  scr.appendChild(go);
}

/* ---- haptics ---- */
function vibrate(ms){ if (navigator.vibrate) { try{ navigator.vibrate(ms); }catch(e){} } }

/* ============================ BOOT ============================ */
function boot(){
  load();
  sweepOnOpen();
  document.getElementById("app").hidden = false;
  document.getElementById("btn-gear").addEventListener("click", openSettings);
  document.querySelectorAll("#nav button").forEach(function(b){
    b.addEventListener("click", function(){ expandedGoal=null; showTab(b.dataset.tab); });
  });
  renderRoot();
}

/* ============================ TEST HARNESS ============================ */
function runTests(){
  const results = [];
  function assert(name, cond, detail){ results.push({name, pass:!!cond, detail}); }
  function eq(a,b){ return JSON.stringify(a)===JSON.stringify(b); }

  // 1. Quota T=5 [hit,hit,miss,hit,resolved,hit,hit]
  (function(){
    const days = {0:"hit",1:"hit",2:"miss",3:"hit",4:"resolved",5:"hit",6:"hit"};
    const m = quotaMath(5, days, 7);
    assert("1 quota hits=5", m.hits===5, m.hits);
    assert("1 quota misses=2", m.misses===2, m.misses);
    assert("1 quota sparesLeft=0", m.sparesLeft===0, m.sparesLeft);
    assert("1 quota verdict HIT", m.verdict==="HIT", m.verdict);
  })();

  // 2. Quota T=5 with 3 misses => OVER BY 1, MISS, still loggable
  (function(){
    const days = {0:"miss",1:"miss",2:"miss",3:"hit",4:"hit",5:"hit",6:"hit"};
    const m = quotaMath(5, days, 7);
    assert("2 quota over=1", m.over===1, m.over);
    assert("2 quota verdict MISS", m.verdict==="MISS", m.verdict);
  })();

  // 3. Pool risk transitions
  (function(){
    assert("3 pool Wed safe", poolRisk(3,4)==="safe", poolRisk(3,4));
    assert("3 pool Thu tight", poolRisk(3,3)==="tight", poolRisk(3,3));
    assert("3 pool Fri risk", poolRisk(3,2)==="risk", poolRisk(3,2));
  })();

  // 4. Fixed Mon/Wed/Fri, Wed missed→Thu, all hit => HIT; Wed renders →; 2nd swap rejected
  (function(){
    const sched=[0,2,4]; const days={0:"hit",2:"miss",4:"hit"}; const swaps={};
    const r1 = trySwapFixed(swaps, sched, 2, 3, 2); // today=Wed(2)? must be future; use today=1
    // redo with today=1 (Tue) so Thu(3) is future
    const swaps2={}; const days2={0:"hit",2:"miss",4:"hit"};
    const rr = trySwapFixed(swaps2, sched, 2, 3, 1);
    assert("4 swap ok", rr.ok===true, rr);
    days2[3]="hit";
    assert("4 fixed verdict HIT", fixedVerdict(sched, days2, swaps2)==="HIT", fixedVerdict(sched,days2,swaps2));
    const inst = fixedInstances(sched, days2, swaps2);
    const wed = inst.find(i=>i.origin===2);
    assert("4 wed moved", swaps2[2]===3, swaps2);
    const rr2 = trySwapFixed(swaps2, sched, 2, 5, 1);
    assert("4 second swap rejected", rr2.ok===false, rr2);
  })();

  // 5. Counter P=3 D=7 [3,4,0,3,3,2,3] => daysHit 5 MISS
  (function(){
    const counts={0:3,1:4,2:0,3:3,4:3,5:2,6:3};
    const m = counterMath(3,7,counts);
    assert("5 counter daysHit=5", m.daysHit===5, m.daysHit);
    assert("5 counter verdict MISS", m.verdict==="MISS", m.verdict);
  })();

  // 6. Late commit Wednesday: dip=5; quota T=5 => T'=4; Mon/Tue not-in-play; fixed Mon dropped
  (function(){
    const dip = daysInPlay(2); // Wed=2
    assert("6 dip=5", dip===5, dip);
    assert("6 prorate T'=4", prorate(5, dip)===4, prorate(5,dip));
    const g = {type:"fixed", params:{days:[0,2,4]}};
    const snap = snapshotParams(g, 2, dip);
    assert("6 fixed Mon dropped", eq(snap.days,[2,4]), snap.days);
  })();

  // 7. Grace: Tue 11:59 Mon editable; Tue 12:00 Mon resolves; Wed Mon view-only
  (function(){
    // criterion 7 is written against a 12:00 deadline, so pin it explicitly —
    // it must keep holding whatever the user's configured grace hour is
    assert("7 Tue 11:59 Mon editable", isResolvable(0,{day:1,hour:11.98},12)===false, "");
    assert("7 Tue 12:00 Mon resolves", isResolvable(0,{day:1,hour:12},12)===true, "");
    // Wed => Mon (older than yesterday) resolvable/view-only
    assert("7 Wed Mon view-only", isResolvable(0,{day:2,hour:9},12)===true, "");
    // the shipped default deadline is 14:00 and the boundary tracks it
    assert("7 default grace hour is 14", CFG.defaultGraceHour===14, CFG.defaultGraceHour);
    assert("7 Tue 13:59 Mon editable @14", isResolvable(0,{day:1,hour:13.98},14)===false, "");
    assert("7 Tue 14:00 Mon resolves @14", isResolvable(0,{day:1,hour:14},14)===true, "");
    assert("7 Tue 12:00 still editable @14", isResolvable(0,{day:1,hour:12},14)===false, "");
    // actual resolve flip on quota
    const goals=[{id:"g",type:"quota"}];
    const wk={committedOnDay:0, goals:[{goalId:"g", snap:{target:5,dip:7}, days:{}, swaps:{}, counts:{}, poolDone:{}}]};
    resolveWeek(goals, wk, {day:1, hour:12}, 12);
    assert("7 resolve sets Mon resolved", wk.goals[0].days[0]==="resolved", wk.goals[0].days);
    assert("7 resolve leaves today unlogged", wk.goals[0].days[1]==null, wk.goals[0].days);
  })();

  // 8. Rollover: prior week unreviewed => forced review; commit prorates
  (function(){
    const saved = state;
    state = seedState();
    // create a committed prior week, unreviewed
    const ck = currentWeekKey();
    const pk = prevWeekKey(ck);
    state.weeks[pk] = buildWeek(0); state.weeks[pk].reviewedAt=null;
    const forced = findForcedReview(ck);
    assert("8 forced review = prior", forced===pk, forced);
    state = saved;
  })();

  // 9. Achievements: SWEEP unlocks once; HONEST requires zero resolved
  (function(){
    const saved = state;
    state = freshState();
    state.goals=[{id:"g",type:"quota",name:"Q",params:{target:5},status:"active",createdWeek:"2026-W10"}];
    const ck="2026-W10";
    state.weeks[ck]=buildWeekFor(["g"],0);
    // all hits => sweep + honest (no resolved, no unlogged)
    const wg=state.weeks[ck].goals[0];
    for (let d=0; d<7; d++) wg.days[d]="hit";
    let earned = evalAchievements(ck);
    assert("9 SWEEP earned", earned.indexOf("SWEEP")>=0, earned);
    assert("9 HONEST earned", earned.indexOf("HONEST")>=0, earned);
    // mark reviewed, second eval must NOT re-earn SWEEP
    state.weeks[ck].reviewedAt="x";
    earned = evalAchievements(ck);
    assert("9 SWEEP not re-earned", earned.indexOf("SWEEP")<0, earned);
    // HONEST fails if a resolved day present
    state = freshState();
    state.goals=[{id:"g",type:"quota",name:"Q",params:{target:5},status:"active",createdWeek:"2026-W11"}];
    state.weeks["2026-W11"]=buildWeekFor(["g"],0);
    const wg2=state.weeks["2026-W11"].goals[0];
    for (let d=0; d<6; d++) wg2.days[d]="hit";
    wg2.days[6]="resolved";
    earned = evalAchievements("2026-W11");
    assert("9 HONEST blocked by resolved", earned.indexOf("HONEST")<0, earned);
    state = saved;
  })();

  // 10. Slot friction: 4 ok, 5 friction, 6 blocked
  (function(){
    assert("10 3 active ok", slotAction(3)==="ok", slotAction(3));
    assert("10 5th friction", slotAction(4)==="friction", slotAction(4));
    assert("10 6th blocked", slotAction(5)==="blocked", slotAction(5));
    assert("10 hard cap holds", slotAction(6)==="blocked", slotAction(6));
  })();

  // 12. FIXED logged on an off day absorbs the earliest owed instance
  (function(){
    const mk = ()=>({ snap:{days:[0,2,4]}, days:{}, swaps:{}, counts:{}, poolDone:{} });
    // Mon missed, session actually done on Tue
    let wg = mk(); wg.days={0:"miss"};
    assert("12 off-day log accepted", logFixedOffDay(wg,1)==="logged", wg);
    assert("12 Mon moved to Tue", wg.swaps[0]===1, wg.swaps);
    assert("12 Tue is a hit", wg.days[1]==="hit", wg.days);
    const inst = fixedInstances(wg.snap.days, wg.days, wg.swaps);
    assert("12 still three instances", inst.length===3, inst.length);
    assert("12 moved instance counts as hit", inst.find(i=>i.origin===0).state==="hit", inst);
    // completing the rest gives a HIT week
    wg.days[2]="hit"; wg.days[4]="hit";
    assert("12 verdict HIT after off-day make-up", fixedVerdict(wg.snap.days,wg.days,wg.swaps)==="HIT",
           fixedVerdict(wg.snap.days,wg.days,wg.swaps));
    // a second off-day session takes the NEXT owed instance, never the moved one
    let wg2 = mk(); wg2.days={0:"miss"};
    logFixedOffDay(wg2,1);
    assert("12 second off-day log accepted", logFixedOffDay(wg2,3)==="logged", wg2.swaps);
    assert("12 absorbs Wed, not Mon again", wg2.swaps[2]===3 && wg2.swaps[0]===1, wg2.swaps);
    // a day already holding a session is not absorbed a second time
    assert("12 occupied day not re-absorbed", logFixedOffDay(wg2,3)===null, wg2.swaps);
    assert("12 dest origin is traceable", fixedDestOrigin(wg2,3)===2, fixedDestOrigin(wg2,3));
    // releasing sends the session back to its own day
    assert("12 release works", releaseFixedDay(wg2,3)===true, wg2.swaps);
    assert("12 Wed instance released", wg2.swaps[2]==null && wg2.days[3]==null, wg2.swaps);
    // nothing owed => nothing to absorb
    let wg3 = mk(); wg3.days={0:"hit",2:"hit",4:"hit"};
    assert("12 nothing owed => no-op", logFixedOffDay(wg3,1)===null, wg3.swaps);
    assert("12 one swap per instance holds", outstandingFixedInstance(wg2)!=null, "");
  })();

  // 11b. legacy state without graceHour falls back to the default
  (function(){
    const saved = state;
    state = seedState(); delete state.settings.graceHour;
    assert("11b legacy state falls back to default grace", graceHour()===CFG.defaultGraceHour, graceHour());
    state.settings.graceHour = 9;
    assert("11b configured grace hour is honoured", graceHour()===9, graceHour());
    state = saved;
  })();

  // 11. Export -> wipe -> import deep-equal
  (function(){
    const saved = state;
    state = seedState();
    const wk = buildWeek(0); state.weeks[currentWeekKey()]=wk;
    const dump = JSON.parse(JSON.stringify(state));
    const exported = JSON.stringify(state, null, 2);
    // wipe
    state = seedState();
    // import
    const imported = JSON.parse(exported);
    assert("11 round-trip deep-equal", eq(imported, dump), "mismatch");
    state = saved;
  })();

  // print
  let pass=0, fail=0;
  console.log("%cWEEK — acceptance harness","font-weight:bold");
  results.forEach(function(r){
    if (r.pass){ pass++; console.log("PASS  "+r.name); }
    else { fail++; console.error("FAIL  "+r.name+"  ("+JSON.stringify(r.detail)+")"); }
  });
  console.log("%c"+pass+" PASS / "+fail+" FAIL","font-weight:bold;color:"+(fail?"#FF4A00":"#1C1D1B"));
  return {pass, fail};
}
/* helper for tests: build a week from explicit goal ids */
function buildWeekFor(ids, committedDay){
  const dip = daysInPlay(committedDay);
  const wg = ids.map(function(id){
    const g = state.goals.find(x=>x.id===id);
    return { goalId:id, snap:snapshotParams(g, committedDay, dip), days:{}, swaps:{}, counts:{}, poolDone:{}, verdict:null };
  });
  return { committedOnDay:committedDay, goals:wg, reviewedAt:null, decisions:{} };
}

/* ============================ ENTRY ============================ */
if (QS.get("test")==="1"){
  // run headless engine tests; still boot UI for inspection
  load();
  runTests();
  boot();
} else {
  boot();
}
